name: Self Count

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_call:

# A tag push and its branch commit both fire this workflow; two gh-pages
# force-pushes racing each other fail one run of the pair (v1.0.1, run 41853129383).
concurrency:
  group: self-count
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  self-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Run LOChy on this repo
        uses: ./
        with:
          output: dist/docs/loc.svg

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: lochy-badge
          path: dist/docs/loc.svg
          if-no-files-found: error

      - name: Publish badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/docs
          publish_branch: gh-pages
