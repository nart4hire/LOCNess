name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- bundle/index.js
      - run: npm test

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Move the major-version tag
        # Consumers pin `owner/repo@v1`; keep that alias on the newest v1.x.y.
        if: "!contains(github.ref_name, '-')"
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_REF_NAME}"
          git push origin "refs/tags/${major}" --force