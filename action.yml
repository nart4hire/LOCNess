name: 'LocNess'
description: 'Generate a self-contained lines-of-code SVG badge with cloc and LOChy'
branding:
  icon: 'bar-chart-2'
  color: 'green'

inputs:
  path:
    description: 'Path to analyze'
    required: false
    default: '.'

  output:
    description: 'Output SVG file path'
    required: false
    default: 'dist/docs/loc.svg'

  font:
    description: 'Path to a .ttf/.otf font file to use instead of the bundled Monocraft font'
    required: false
    default: ''

  mascot:
    description: >-
      Path to a .png mascot. Defaults to the bundled LOChy artwork; supply your
      own image to ship a badge without the Lochy brand assets.
    required: false
    default: ''

  outline_text:
    description: >-
      'true' bakes every string to glyph outlines (renders identically anywhere,
      larger file). 'false' emits selectable <text> with a monospace fallback
      stack and adds <title>/aria-label, which makes the counts machine-readable.
    required: false
    default: 'true'

  exclude:
    description: >-
      Comma-separated directory names cloc must not count. Defaults skip
      generated and vendored code so the badge reflects source, not build output.
    required: false
    default: 'node_modules,vendor,bundle,build,dist,coverage'

  exclude_files:
    description: >-
      Perl regex of filenames cloc must not count. Defaults to the generated
      lock files (package-lock.json, pnpm-lock.yaml, Cargo.lock, go.sum, ...).
      Set to a space to disable the filter entirely.
    required: false
    default: 'package-lock\.json$|npm-shrinkwrap\.json$|pnpm-lock\.yaml$|yarn\.lock$|bun\.lockb?$|Cargo\.lock$|poetry\.lock$|Pipfile\.lock$|composer\.lock$|Gemfile\.lock$|packages\.lock\.json$|go\.sum$'

  title:
    description: 'Badge title (defaults to $GITHUB_REPOSITORY)'
    required: false
    default: ''

runs:
  using: 'node20'
  main: 'bundle/index.js'